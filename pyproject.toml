[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reefanalysis"
version = "0.1.0"
description = "Coral reef structural analysis from LiDAR / bathymetric data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "scikit-learn>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
las = ["laspy[lazrs]>=2.4"]
dev = ["pytest>=7.0"]

[project.scripts]
reefanalysis = "reefanalysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
